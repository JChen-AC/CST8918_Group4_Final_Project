name: Build and push weather app image to ACR

on:
  pull_request:
    branches:
      - main
    paths:
      - 'app/**'

permissions:
  id-token: write
  contents: read

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    env:
      IMAGE_TAG: ${{ github.sha }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Azure login using OIDC
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Resolve ACR details from Azure
        id: acr
        shell: bash
        run: |
          ACR_NAME=$(az acr list --query "[?contains(name, 'weather')].name | [0]" -o tsv)
          ACR_LOGIN_SERVER=$(az acr show --name "$ACR_NAME" --query loginServer -o tsv)

          echo "acr_name=$ACR_NAME" >> $GITHUB_OUTPUT
          echo "acr_login_server=$ACR_LOGIN_SERVER" >> $GITHUB_OUTPUT

      - name: Log in to Azure Container Registry
        run: az acr login --name "${{ steps.acr.outputs.acr_name }}"

      - name: Build Docker image
        run: |
          docker build \
            -t "${{ steps.acr.outputs.acr_login_server }}/weather-app:${{ env.IMAGE_TAG }}" \
            ./app

      - name: Push Docker image to ACR
        run: |
          docker push "${{ steps.acr.outputs.acr_login_server }}/weather-app:${{ env.IMAGE_TAG }}"
